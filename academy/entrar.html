<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Condeixa · Iniciar Sessão</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="font-['IBM_Plex_Sans',sans-serif] antialiased min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-950">

    <div class="absolute inset-0 z-0">
        <img src="equipa.png" alt="Equipa Academia Condeixa" class="w-full h-full object-cover object-center filter brightness-50 scale-105">
        <div class="absolute inset-0 bg-gradient-to-tr from-slate-950 via-slate-900/80 to-slate-950/70 backdrop-blur-[2px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-4 bg-white/95 backdrop-blur-md border border-slate-200/50 rounded-3xl shadow-2xl p-8 md:p-10 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="inline-flex justify-center items-center bg-slate-900 p-2.5 rounded-2xl shadow-md mb-1">
                <img src="logo.png" alt="Academia Condeixa" class="w-12 h-12 object-contain">
            </div>
            <h1 class="font-['Bricolage_Grotesque',sans-serif] text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">
                Academia Condeixa
            </h1>
            <p class="text-xs font-medium text-slate-500">Portal do Atleta · Introduz as tuas credenciais</p>
        </div>

        <form action="index.html" method="get" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1.5">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"></span>
                    <input type="email" required class="w-full rounded-xl border border-slate-300 pl-3 pr-3.5 py-3 text-slate-800 bg-slate-50/50 focus:bg-white focus:border-lime-500 focus:outline-none focus:ring-2 focus:ring-lime-500/20 transition-all font-medium">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="font-semibold text-slate-700">Palavra-passe</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"></span>
                    <input type="password" required class="w-full rounded-xl border border-slate-300 pl-3 pr-3.5 py-3 text-slate-800 bg-slate-50/50 focus:bg-white focus:border-lime-500 focus:outline-none focus:ring-2 focus:ring-lime-500/20 transition-all font-medium">
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="lembrar" class="w-4 h-4 rounded border-slate-300 text-lime-500 focus:ring-lime-500 cursor-pointer">
                    <label for="lembrar" class="text-slate-600 cursor-pointer select-none">Lembrar-me</label>
                </div>
            </div>

            <button type="submit" class="w-full bg-lime-500 hover:bg-lime-600 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-lime-500/20 text-sm mt-3 active:scale-[0.99]">
                Entrar
            </button>
        </form>

        <div class="text-center border-t border-slate-100 pt-5 text-xs text-slate-500 space-y-2">
            <p>Dificuldades no acesso? <a href="#" class="text-slate-900 font-bold hover:underline">Contacta o suporte técnico</a></p>
            <p class="text-[10px] text-slate-400">Academia Condeixa · Todos os direitos reservados © 2026</p>
        </div>
    </div>

</body>
</html>
